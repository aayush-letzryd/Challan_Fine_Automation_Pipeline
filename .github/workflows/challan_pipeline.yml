name: Challan Fine Automation Pipeline (Alternate Days)

on:
  # Schedule paused pending GCP Mumbai / Indian runner setup with manager approval
  # schedule:
  #   - cron: '30 2 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-challans:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Challan Scraping Pipeline
        run: xvfb-run --auto-servernum -- node main.js
        env:
          HEADLESS: "true"
          MAX_BATCHES: ${{ vars.MAX_BATCHES || '30' }}
          COOLDOWN_SECONDS: ${{ vars.COOLDOWN_SECONDS || '15' }}
          PGHOST: ${{ secrets.PGHOST || '35.200.196.113' }}
          PGPORT: ${{ secrets.PGPORT || '5432' }}
          PGDATABASE: ${{ secrets.PGDATABASE || 'postgres' }}
          PGUSER: ${{ secrets.PGUSER || 'postgres' }}
          PGPASSWORD: ${{ secrets.PGPASSWORD || '8S5]U3@L^Xz)\\FH}' }}

      - name: Commit & Push Updated Checkpoints & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoint.json challan_results.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update challan results and checkpoints [skip ci]" && git push)

