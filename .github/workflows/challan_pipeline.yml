name: Challan Fine Automation Pipeline (Alternate Days)

on:
  schedule:
    # Runs at 02:30 UTC (8:00 AM IST) on alternate days (Monday, Wednesday, Friday)
    - cron: '30 2 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-challans:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Challan Scraping Pipeline (10 Batches - 500 Vehicles / Day)
        run: xvfb-run --auto-servernum -- node main.js
        env:
          HEADLESS: "true"
          MAX_BATCHES: "10"
          COOLDOWN_MINUTES: "10"
          PGHOST: "35.200.196.113"
          PGPORT: "5432"
          PGDATABASE: "postgres"
          PGUSER: "postgres"
          PGPASSWORD: "8S5]U3@L^Xz)\\FH}"

      - name: Commit & Push Updated Checkpoints & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoint.json challan_results.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update challan results and checkpoints [skip ci]" && git push)
